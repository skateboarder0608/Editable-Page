<!DOCTYPE html>
<html>
	<head>
		<title>This Is An Editable Page</title>
		<link rel="icon" type="image/x-icon" href="Images/EditablePage.jpeg">
		<style>
			body{
				font-family: sans-serif;
			}
		</style>
	</head>
	<body>
		<div>
			<p>
				_
				<button onclick="document.body.contentEditable = 'true'; document.designMode = 'on';">Click to Edit</button>
				<button onclick="document.body.contentEditable = 'false'; document.designMode = 'off'">Press This to Turn Off Editing</button>
			</p>
		</div>
		<p>If you clicked the button you're able to edit this.</p>
		<h6>This page will not save.</h6>
		<button onclick="window.print()">Print</button>
	</body>
</html>
